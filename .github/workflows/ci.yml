name: API CI

on:
  pull_request:
    branches:
      - main
      - chore/api-foundation

  push:
    branches:
      - main
      - chore/api-foundation
      - chore/backend-team-setup

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/sitetrace_ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run check

      - name: Lint API
        run: npm run lint

      - name: Run unit tests
        run: npm run test