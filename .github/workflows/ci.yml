name: API CI

on:
  pull_request:
    branches:
      - main
      - chore/api-foundation

  push:
    branches:
      - main
      - chore/api-foundation

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sitetrace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sitetrace_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/sitetrace_ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run check

      - name: Lint API
        run: npm run lint

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm run test

      - name: Run PostgreSQL E2E tests
        run: npm run test:e2e